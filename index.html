<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZS Field App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#14181F; --ink2:#4A515C; --line:#C9CED6; --soft:#E6E8EC;
  --blue:#1F5FBF; --blue2:#174A94; --blueSoft:#DCE7F7; --onBlue:#FFFFFF;
  --urg:#8A3A08; --urgSoft:#FBE3D2; --ok:#1E6B3A; --okSoft:#DDF0E3; --warnSoft:#FFF6F0; --warnLine:#E0A27A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1216; --card:#1A1F27; --ink:#EEF1F5; --ink2:#AEB6C2; --line:#3A424F; --soft:#262C36;
    --blue:#7FA8EC; --blue2:#9DBDF2; --blueSoft:#1E2C44; --onBlue:#0F1216;
    --urg:#F2A877; --urgSoft:#3A2416; --ok:#7FCB98; --okSoft:#17301F; --warnSoft:#2A1E16; --warnLine:#8A5A3A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1216; --card:#1A1F27; --ink:#EEF1F5; --ink2:#AEB6C2; --line:#3A424F; --soft:#262C36;
  --blue:#7FA8EC; --blue2:#9DBDF2; --blueSoft:#1E2C44; --onBlue:#0F1216;
  --urg:#F2A877; --urgSoft:#3A2416; --ok:#7FCB98; --okSoft:#17301F; --warnSoft:#2A1E16; --warnLine:#8A5A3A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--soft)}
.hbar{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.seg.many{display:flex;flex-wrap:wrap;border-radius:16px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
h1{font-size:28px;margin:20px 0 4px}
h2{font-size:20px;margin:24px 0 8px}
.sub{color:var(--ink2);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--soft);border-radius:16px;padding:16px;margin:12px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.tag.urg{background:var(--urgSoft);color:var(--urg)}
.tag.blue{background:var(--blueSoft);color:var(--blue2)}
.tag.ok{background:var(--okSoft);color:var(--ok)}
.ttl{font-weight:700;font-size:19px;margin:2px 0}
.meta{color:var(--ink2);font-size:15px;margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--onBlue)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--onBlue)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;padding:10px 0;cursor:pointer;min-height:44px}
label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chip{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:8px;cursor:pointer;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blueSoft);color:var(--blue2)}
.alert{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--warnSoft);border:1px solid var(--warnLine);font-size:15px}
.note{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--blueSoft);color:var(--ink);font-size:15px}
.err{color:var(--urg);font-weight:700;font-size:15px;margin-top:8px}
.steps{display:flex;gap:6px;margin-top:12px}
.step{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink2)}
.step .bar{height:6px;border-radius:3px;background:var(--soft);margin-bottom:4px}
.step.on{color:var(--ink)} .step.on .bar{background:var(--blue)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img,.photos video{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--soft);background:var(--soft)}
.file{display:block;width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:12px;font:inherit;color:var(--ink2);background:var(--card)}
.big{font-size:22px;font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:28px 12px}
.writeup{white-space:pre-wrap}
.back{display:inline-flex;align-items:center;gap:4px}
.small{font-size:13px;color:var(--ink2)}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--blueSoft);font-size:15px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.fbdone{opacity:.6}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--blueSoft)}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.chat textarea{min-height:80px}
input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
.wrap.wide{max-width:1180px}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.calnav input{width:auto}
.calday{font-weight:700;font-size:18px;margin-right:auto}
.sched{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px}
@media (min-width:900px){.sched{grid-template-columns:280px minmax(0,1fr)}}
.ulist{border-radius:16px;padding:8px;background:var(--soft);min-height:80px}
.ulist.over{outline:3px dashed var(--blue);outline-offset:-3px}
.ulist h3{font-size:15px;margin:4px 6px 8px}
.ucard{background:var(--card);border:1px solid var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:grab;user-select:none;-webkit-user-select:none;display:flex;gap:8px;align-items:flex-start}
.ucard .grow{flex:1;min-width:0}
.grip{flex:none;width:32px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--soft);color:var(--ink2);font-size:18px;touch-action:none}
.best{display:inline-block;font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--okSoft);color:var(--ok)}
.calwrap{overflow-x:auto;background:var(--card);border:1px solid var(--soft);border-radius:16px}
.cal{min-width:560px;display:grid;grid-template-columns:72px repeat(var(--n),minmax(0,1fr))}
.lh{padding:10px 6px;font-weight:700;font-size:15px;text-align:center;border-bottom:1px solid var(--soft);border-left:1px solid var(--soft)}
.lh .small{display:block;font-weight:400}
.tcol{position:relative}
.tcol span{position:absolute;right:8px;white-space:nowrap;font-size:12px;color:var(--ink2);transform:translateY(-50%)}
.tcol span:first-child{transform:none}
.lane{position:relative;border-left:1px solid var(--soft);background-image:repeating-linear-gradient(to bottom,var(--soft) 0 1px,transparent 1px 56px)}
.lane.over{background-color:var(--blueSoft)}
.band{position:absolute;left:0;right:0;opacity:0;background:var(--okSoft);pointer-events:none;transition:opacity .15s}
.cal[data-hl="morning"] .band.morning,.cal[data-hl="afternoon"] .band.afternoon{opacity:.85}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;background:var(--blueSoft);border:1px solid var(--blue);border-left-width:4px;padding:2px 6px;font-size:13px;line-height:1.25;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--ink)}
.blk.urg{border-color:var(--urg);background:var(--urgSoft)}
.blk b{display:block}
.blk .warn{color:var(--urg);font-weight:700}
.dropbox{position:absolute;left:4px;right:4px;border:2px dashed var(--blue);border-radius:8px;background:color-mix(in srgb,var(--blueSoft) 60%,transparent);pointer-events:none;z-index:2;font-size:12px;font-weight:700;color:var(--blue2);padding:2px 6px}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.95;box-shadow:0 8px 20px rgba(0,0,0,.25);margin:0;display:block}
.ghost .grip,.ghost .btn{display:none}
#ed{scroll-margin-top:90px}
.ghost .gt{display:block;font-weight:700;color:var(--blue2)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
</style>
</head>

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const addDays=(day,n)=>{const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const fmtClock=hm=>{ if(!hm) return ""; const [h,m]=hm.split(":").map(Number); const d=new Date(2000,0,1,h,m); return d.toLocaleTimeString(loc(),{hour:"numeric",minute:"2-digit"}); };
const toMin=hm=>{const [h,m]=String(hm||"0:0").split(":").map(Number);return h*60+(m||0)};
const ARRIVE_WIN=60;
const fmtWindow=v=>{ if(!v||!v.date) return ""; if(!v.start) return fmtVisit(v); const d=new Date(v.date+"T12:00:00");
  return d.toLocaleDateString(loc(),{weekday:"short",month:"short",day:"numeric"})+" · "+t("arriveWin")+" "+fmtClock(v.start)+" "+t("and")+" "+fmtClock(toHm(Math.min(toMin(v.start)+ARRIVE_WIN,23*60+59))); };
const toHm=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");

/* ---------- server calls ---------- */
async function api(method,path,body){
  const h={"Content-Type":"application/json"};
  if(S.pin) h["x-worker-pin"]=S.pin;
  if(S.opin) h["x-office-pin"]=S.opin;
  let r;
  try{ r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw Object.assign(new Error(t("netErr")),{status:0}); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401&&path.startsWith("/api/office")){ if(S.oauthed||S.opin){ S.oauthed=false; S.opin=""; store.del("mzs-opin"); if(S.role==="office"){S.view="opin"; S.pinErr=t("pinWrong");} render(); } }
    else if(r.status===401&&S.authed){ S.authed=false; S.pin=""; store.del("mzs-pin"); if(S.role==="worker"){S.view="pin"; S.pinErr=t("pinWrong");} render(); }
    throw Object.assign(new Error(j.error||t("saveErr")),{status:r.status});
  }
  return j;
}

function readB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
async function shrink(file){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const max=1600, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return b||file;
  }catch(e){ return file; }
}
async function uploadFiles(id,field,files){
  let last=null, failed=0, tooBig=0;
  for(const f of files){
    try{
      const blob=await shrink(f);
      if(blob.size>5*1024*1024){ tooBig++; continue; }
      const type=blob.type||f.type||"image/jpeg";
      const name=(f.name||"photo").replace(/\.[^.]+$/,"")+(type==="image/jpeg"?".jpg":"");
      last=await api("POST","/api/requests/"+id+"/photos",{field,contentType:type,filename:name,data:await readB64(blob)});
    }catch(e){ failed++; }
  }
  return {last,failed,tooBig};
}

const CAL_START=7, CAL_END=19, PXH=56, PXM=PXH/60, SNAP=15;

const isPlaced=j=>!!(j.worker&&S.cfg.workers.includes(j.worker)&&j.visit&&j.visit.start&&j.visit.date);

const fitsBest=j=>{ if(!j.visit||!j.visit.start||!j.timePref||j.timePref==="anytime") return true; return (toMin(j.visit.start)<720)===(j.timePref==="morning"); };
function fmtLen(n){ return n%60?(n>=60?Math.floor(n/60)+"h ":"")+(n%60)+"m":(n/60)+"h"; }
function vSchedule(open){

// Save to the server. Shows the change right away, puts it back if the save fails.
async function placeJob(id,body){
  const j=S.office.find(x=>x.id===id); if(!j) return false;
  const before=JSON.stringify(j);
  if(body.clear){ j.worker=""; j.visit=null; if(j.status==="scheduled") j.status="received"; }
  else { j.worker=body.worker; j.mins=body.mins; j.visit={date:body.date,start:body.start,slot:body.start<"12:00"?"morning":"afternoon"}; if(j.status==="received"||j.status==="blocked") j.status="scheduled"; }
  S.oErr=""; render();
  try{ const r=await api("PATCH","/api/office/"+id+"/schedule",body); Object.assign(j,r,{messages:j.messages}); render(); return true; }
  catch(e){ Object.assign(j,JSON.parse(before)); S.oErr=e.message||t("saveErr"); render(); return false; }
}

/* drag and drop with mouse, pen, or touch (touch uses the ⠿ handle on list cards) */
function startDrag(ev){
  const el=ev.target.closest("[data-drag]"); if(!el||ev.button>0||ev.target.closest("[data-act]")) return;
  if(ev.pointerType==="touch"&&!ev.target.closest(".grip")&&!el.classList.contains("blk")) return;
  const r=el.getBoundingClientRect();
  drag={id:el.dataset.drag, el, x0:ev.clientX, y0:ev.clientY, dx:ev.clientX-r.left, dy:ev.clientY-r.top, w:r.width, moved:false, ghost:null, lane:null, start:null, un:false};
  ev.preventDefault();
}
function moveDrag(ev){
  if(!drag) return;
  if(!drag.moved){
    if(Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)<6) return;
    drag.moved=true; document.body.classList.add("dragging");
    const j=S.office.find(x=>x.id===drag.id)||{};
    const g=drag.el.cloneNode(true); g.classList.add("ghost"); g.removeAttribute("data-drag");
    g.style.width=Math.min(drag.w,260)+"px"; g.style.height="auto"; g.style.top="0"; g.style.left="0";
    g.insertAdjacentHTML("afterbegin",`<span class="gt"></span>`);
    document.body.appendChild(g); drag.ghost=g;
    const cal=document.getElementById("cal"); if(cal&&j.timePref&&j.timePref!=="anytime") cal.dataset.hl=j.timePref;
    drag.el.style.opacity=".35";
  }
  // Card follows to the right of the pointer so the dotted drop box stays visible
  drag.ghost.style.transform=`translate(${ev.clientX+24+drag.ghost.offsetWidth>innerWidth-8?Math.max(8,ev.clientX-24-drag.ghost.offsetWidth):ev.clientX+24}px,${ev.clientY+12}px)`;
  if(ev.clientY<60) window.scrollBy(0,-12); else if(ev.clientY>innerHeight-60) window.scrollBy(0,12);
  const under=document.elementFromPoint(ev.clientX,ev.clientY);
  const lane=under&&under.closest(".lane"), un=under&&under.closest("[data-drop=un]");
  document.querySelectorAll(".lane.over,.ulist.over").forEach(x=>x.classList.remove("over"));
  document.querySelectorAll(".dropbox").forEach(x=>x.remove());
  drag.lane=null; drag.un=false; drag.start=null;
  const gt=drag.ghost.querySelector(".gt");
  if(lane){
    lane.classList.add("over");
    const top=ev.clientY-lane.getBoundingClientRect().top-8;
    let m=CAL_START*60+Math.round(top/PXM/SNAP)*SNAP;
    m=Math.max(CAL_START*60,Math.min(CAL_END*60-SNAP,m));
    drag.lane=Number(lane.dataset.lane); drag.start=toHm(m);
    gt.textContent=S.cfg.workers[drag.lane]+" · "+fmtClock(drag.start);
    const len=(S.office.find(x=>x.id===drag.id)||{}).mins||60;
    const box=document.createElement("div"); box.className="dropbox";
    box.style.top=(m-CAL_START*60)*PXM+"px"; box.style.height=Math.max(22,Math.min(len,CAL_END*60-m)*PXM-2)+"px";
    box.textContent=fmtClock(drag.start)+"–"+fmtClock(toHm(m+len));
    lane.appendChild(box);
  } else if(un){ un.classList.add("over"); drag.un=true; gt.textContent=t("takeOff"); }
  else gt.textContent="";
}
async function endDrag(){
  if(!drag) return;
  const d=drag; drag=null;
  document.body.classList.remove("dragging");
  document.querySelectorAll(".lane.over,.ulist.over").forEach(x=>x.classList.remove("over"));
  document.querySelectorAll(".dropbox").forEach(x=>x.remove());
  const cal=document.getElementById("cal"); if(cal) delete cal.dataset.hl;
  if(d.ghost) d.ghost.remove(); d.el.style.opacity="";
  if(!d.moved){ openEditor(d.id); return; }
  const j=S.office.find(x=>x.id===d.id);
  if(j&&d.lane!=null&&d.start){
    await placeJob(d.id,{worker:S.cfg.workers[d.lane],date:S.calDate,start:d.start,mins:j.mins||60});
  } else if(j&&d.un&&isPlaced(j)){ await placeJob(d.id,{clear:true}); }
  else if(pending){ pending=false; render(); }
}

    <textarea id="j-notes" data-notes="${esc(id)}">${esc(notes)}</textarea>
    <div class="row"><button class="btn sm" data-act="saveNotes" data-id="${esc(id)}">${S.flash[id+"n"]?t("saved")+" ✓":t("saveNotes")}</button>
    ${S.cfg.writeup?`<button class="btn sm primary" data-act="ai" data-id="${esc(id)}" ${busy("ai")?"disabled":""}>${busy("ai")?t("writing"):t("makeWriteup")}</button>`:""}</div>
    ${(wu||busy("ai"))?`<label for="j-wu">${t("writeup")}</label><p class="small" style="margin:0 0 6px">${t("writeupHint")}</p>
    <textarea id="j-wu" data-wu="${esc(id)}" style="min-height:140px">${esc(wu)}</textarea>
    <div class="row"><button class="btn sm" data-act="saveWu" data-id="${esc(id)}">${S.flash[id+"w"]?t("saved")+" ✓":t("saveWriteup")}</button></div>`:""}
    ${S.err[id]?`<p class="err" role="alert">${esc(S.err[id])}</p>`:""}
  </div>

  ${done?"":`<div style="margin-top:16px"><button class="btn ok block" data-act="done" data-id="${esc(id)}">${t("markDone")} ✓</button></div>
  <h2>${t("couldnt")}</h2>
  <div class="chips">${BLOCKS.map(b=>`<button class="chip" data-act="block" data-v="${b}" data-id="${esc(id)}" aria-pressed="${j.status==="blocked"&&j.blockReason===b}">${t(b)}</button>`).join("")}</div>`}`;
}
function vFeedback(){
  const d=S.fbDraft;
  const list=S.fb.slice().sort((a,b)=>(a.handled?1:0)-(b.handled?1:0)||(b.createdAt||0)-(a.createdAt||0));
  const card=f=>`<div class="card ${f.handled?"fbdone":""}">
    <div class="tags"><span class="tag blue">${esc(t("k_"+f.kind)).toUpperCase()}</span>${f.handled?`<span class="tag ok">${t("handled")}</span>`:""}</div>
    <p class="meta"><b>${esc(t("sc_"+f.screen))}</b> · ${fmtDate(f.createdAt)} ${fmtTime(f.createdAt)}</p>
    <p style="margin:6px 0 0;white-space:pre-wrap">${esc(f.text)}</p>
    <div class="row"><button class="btn sm" data-act="fbHandled" data-id="${esc(f.id)}">${f.handled?t("reopenFb"):t("markHandled")}</button></div>
  </div>`;
  return `<button class="link back" data-act="fbBack">${t("backToApp")}</button>
  <h1>${t("fbTitle")}</h1>
  <p class="sub">${t("fbSub")}</p>
  <label for="fb-screen">${t("fbWhere")}</label>
  <select id="fb-screen" data-fbsel="screen">${FB_SCREENS.map(s=>`<option value="${s}" ${d.screen===s?"selected":""}>${t("sc_"+s)}</option>`).join("")}</select>
  <label id="l-kind">${t("fbKind")}</label>
  <div class="chips" role="group" aria-labelledby="l-kind">${FB_KINDS.map(k=>chip("fbKind",k,d.kind===k,t("k_"+k))).join("")}</div>
  <label for="fb-text">${t("fbText")}</label>
  <textarea id="fb-text" data-fb="1">${esc(d.text)}</textarea>
  ${S.fbErr?`<p class="err" role="alert">${esc(S.fbErr)}</p>`:""}
  ${S.fbSent?`<p class="meta" role="status" style="color:var(--ok)"><b>${t("fbThanks")}</b></p>`:""}
  <div style="margin-top:16px"><button class="btn primary block" data-act="fbSend" ${S.fbSending?"disabled":""}>${S.fbSending?t("sending"):t("fbSendBtn")}</button></div>
  <h2>${t("fbList")}${S.authed?` (${list.length})`:""}</h2>
  ${!S.authed?`<p class="meta">${t("fbPinNote")}</p>`:list.length?list.map(card).join(""):`<p class="empty">${t("fbNone")}</p>`}`;
}

/* ---------- writes ---------- */
async function upd(id,patch){
  try{ putJob(await api("PATCH","/api/jobs/"+id,patch)); delete S.err[id]; render(); return true; }
  catch(e){ S.err[id]=e.message||t("saveErr"); render(); return false; }
}
function flash(key){ S.flash[key]=1; render(); setTimeout(()=>{delete S.flash[key]; soft();},1800); }

async function send(){
  if(inOffice()) return sendOffice();
  const d=S.draft;
  if(!d.apt.trim()||!d.phone.trim()||!d.category){ S.formErr=t("needApt"); render(); return; }
  S.formErr=""; S.sending=true; render();
  try{
    const r=await api("POST","/api/requests",{building:d.building.trim(),apt:d.apt.trim(),phone:d.phone.trim(),name:d.name.trim(),category:d.category,details:d.details.trim(),timePref:d.timePref,priority:d.priority,lang:S.lang,byWorker:!!S.fromWorker});
    let note="";
    if(S.files.length){ const u=await uploadFiles(r.id,"tenant",S.files); if(u.tooBig) note=t("tooBig"); else if(u.failed) note=t("uploadErr"); }
    if(!S.fromWorker){
      saved={building:d.building,apt:d.apt,phone:d.phone,name:d.name}; store.set("mzs-me",JSON.stringify(saved));
      S.lookup={phone:d.phone,apt:d.apt};
    }
    S.lastTicket=r.ticket; S.files=[];
    S.draft=Object.assign({category:"",details:"",timePref:"anytime",priority:"medium",priTouched:false},S.fromWorker?{building:"",apt:"",phone:"",name:""}:saved);
    S.sending=false; S.formErr=note;
    if(S.fromWorker){ S.fromWorker=false; S.view="jobs"; await loadJobs(); }
    else S.view="sent";
    render(); window.scrollTo(0,0);
  }catch(e){ S.sending=false; S.formErr=e.message||t("saveErr"); render(); }
}
// Office sends a request for a tenant, then sees it on the schedule
async function sendOffice(){
  const d=S.oDraft;
  if(!d.apt.trim()||!d.category){ S.formErr=t("needApt"); render(); return; }
  S.formErr=""; S.sending=true; render();
  try{
    const r=await api("POST","/api/requests",{building:d.building.trim(),apt:d.apt.trim(),phone:d.phone.trim(),name:d.name.trim(),category:d.category,details:d.details.trim(),timePref:d.timePref,priority:d.priority,lang:S.lang});
    let note="";
    if(S.files.length){ const u=await uploadFiles(r.id,"tenant",S.files); if(u.tooBig) note=t("tooBig"); else if(u.failed) note=t("uploadErr"); }
    S.files=[]; S.sending=false;
    S.oDraft={building:"",apt:"",phone:"",name:"",category:"",details:"",timePref:"anytime",priority:"medium",priTouched:false};
    S.oMsg=t("oSent")+" #"+r.ticket+(note?" · "+note:""); S.oTab="sched";
    await loadOffice(); render(); window.scrollTo(0,0);
    setTimeout(()=>{ S.oMsg=""; soft(); },6000);
  }catch(e){ S.sending=false; S.formErr=e.message||t("saveErr"); render(); }
}
async function writeUp(id){
  const j=S.jobs.find(x=>x.id===id); if(!j) return;
  const notes=(S.notes[id]??j.notes??"").trim();
  S.busy[id+"ai"]=1; render();
  try{
    const r=await api("POST","/api/writeup",{id,notes});
    delete S.busy[id+"ai"];
    if(await upd(id,{notes,writeup:r.text})){ delete S.notes[id]; delete S.writeups[id]; }
  }catch(e){ delete S.busy[id+"ai"]; S.err[id]=t("aiErr"); render(); }
}
async function tryPin(pin){
  S.pin=pin; S.pinBusy=true; S.pinErr=""; render();
  const ok=await loadJobs();
  S.pinBusy=false;
  if(ok){ S.authed=true; store.set("mzs-pin",pin); S.view="jobs"; try{S.health=await api("GET","/api/health")}catch(e){} }
  else { S.pin=""; S.pinErr=t("pinWrong"); }
  render();
}

async function tryOfficePin(pin){
  S.opin=pin; S.pinBusy=true; S.pinErr=""; render();
  const ok=await loadOffice();
  S.pinBusy=false;
  if(ok){ S.oauthed=true; store.set("mzs-opin",pin); S.view="office"; try{S.health=await api("GET","/api/health")}catch(e){} }
  else { S.opin=""; S.pinErr=t("pinWrong"); }
  render();
}
async function chatSend(id){
  const text=(S.chat[id]||"").trim(); if(!text) return;
  const office=S.view==="officeReq";
  S.chatBusy[id]=1; render();
  try{
    const r=office?await api("POST","/api/office/"+id+"/messages",{text})
      :await api("POST","/api/my/"+id+"/messages",{phone:S.lookup.phone,apt:S.lookup.apt,text});
    const j=(office?S.office:S.mine).find(x=>x.id===id); if(j) j.messages=r.messages;
    delete S.chat[id]; delete S.chatErr[id];
  }catch(e){ S.chatErr[id]=e.message||t("saveErr"); }
  delete S.chatBusy[id]; render();
}

/* ---------- events ---------- */
function goWorker(){ S.view=S.authed?"jobs":"pin"; if(S.authed) loadJobs(); }
function goOffice(){ S.view=S.oauthed?"office":"opin"; S.pinErr=""; if(S.oauthed) loadOffice(); }
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
  if(a==="pickFiles"||a==="jobPhoto") return;
  if(a==="role"){ S.role=v; store.set("mzs-role",v); S.fromWorker=false; if(v==="worker") goWorker(); else if(v==="office") goOffice(); else S.view="form"; render(); window.scrollTo(0,0); return; }
  if(a==="lang"){ S.lang=v; store.set("mzs-lang",v); render(); return; }
  if(a==="cat"){ const d=draft(); d.category=v; if(!d.priTouched) d.priority=(v==="heat"||v==="leak")?"urgent":"medium"; render(); return; }
  if(a==="time"){ draft().timePref=v; render(); return; }
  if(a==="send"){ send(); return; }
  if(a==="toMine"){ S.view="mine"; render(); window.scrollTo(0,0); loadMine(); return; }
  if(a==="lookup"){ S.lookup={phone:S.lookup.phone.trim(),apt:S.lookup.apt.trim()}; loadMine(); render(); return; }
  if(a==="newForm"){ S.view="form"; S.formErr=""; render(); window.scrollTo(0,0); return; }
  if(a==="toJobs"){ S.view="jobs"; S.fromWorker=false; render(); window.scrollTo(0,0); return; }
  if(a==="pinGo"){ const el=document.getElementById("p-pin"); const p=el?el.value.trim():""; if(p){ if(v==="office") tryOfficePin(p); else tryPin(p); } return; }
  if(a==="oSignOut"){ S.oauthed=false; S.opin=""; S.office=[]; store.del("mzs-opin"); S.view="opin"; render(); return; }
  if(a==="otab"){ S.oTab=v; S.ed=null; S.formErr=""; render(); return; }
  if(a==="calDay"){ S.calDate=v==="0"?today():addDays(S.calDate,Number(v)); render(); return; }
  if(a==="edSched"){ openEditor(id); return; }
  if(a==="edCancel"){ S.ed=null; render(); return; }
  if(a==="edSave"){ const e=S.ed; if(!e) return;
    if(!e.worker||!/^\d{2}:\d{2}$/.test(e.start||"")||!e.date){ e.err=t("needTime"); render(); return; }
    e.busy=true; e.err=""; render();
    const ok=await placeJob(e.id,{worker:e.worker,date:e.date,start:e.start,mins:Number(e.mins)||60});
    if(ok){ S.calDate=e.date; S.ed=null; } else if(S.ed){ S.ed.busy=false; S.ed.err=S.oErr; }
    render(); return; }
  if(a==="edClear"){ const e=S.ed; if(!e) return; e.busy=true; render(); const ok=await placeJob(e.id,{clear:true}); if(ok) S.ed=null; else if(S.ed) S.ed.busy=false; render(); return; }
  if(a==="openReq"){ S.oId=id; S.view="officeReq"; render(); window.scrollTo(0,0); loadOffice(); return; }
  if(a==="oNewReq"){ S.view="office"; S.oTab="new"; S.ed=null; S.formErr=""; render(); window.scrollTo(0,0); return; }
  if(a==="toOffice"){ S.view="office"; render(); window.scrollTo(0,0); return; }
  if(a==="chat"){ S.chatOpen[id]=!S.chatOpen[id]; render(); return; }
  if(a==="chatSend"){ chatSend(id); return; }
  if(a==="signOut"){ S.authed=false; S.pin=""; S.jobs=[]; S.fb=[]; store.del("mzs-pin"); S.view="pin"; render(); return; }
  if(a==="wtab"){ S.workerTab=v; render(); return; }
  if(a==="wme"){ S.wMe=v; if(v) store.set("mzs-wme",v); else store.del("mzs-wme"); render(); return; }
  if(a==="openJob"){ S.jobId=id; S.view="job"; render(); window.scrollTo(0,0); return; }
  if(a==="flag"){ S.fromWorker=true; S.draft={building:"",apt:"",phone:"",name:"",category:"",details:"",timePref:"anytime",priority:"medium",priTouched:false}; S.view="form"; S.formErr=""; render(); window.scrollTo(0,0); return; }
  if(a==="reopen"){ try{ await api("POST","/api/my/"+id+"/reopen",{phone:S.lookup.phone,apt:S.lookup.apt}); }catch(e){ S.mineErr=e.message; } loadMine(); return; }
  if(a==="urgent"){ const j=S.jobs.find(x=>x.id===id); if(j) await upd(id,{urgent:!j.urgent}); return; }
  if(a==="saveSched"){ const j=S.jobs.find(x=>x.id===id); if(!j) return;
    const sc=S.sched[id]||{date:(j.visit&&j.visit.date)||today(),slot:(j.visit&&j.visit.slot)||j.timePref||"anytime"};
    const patch={visit:{date:sc.date,slot:sc.slot}}; if(j.status==="received"||j.status==="blocked"){ patch.status="scheduled"; patch.blockReason=null; }
    if(await upd(id,patch)){ delete S.sched[id]; flash(id+"s"); } return; }
  if(a==="start"){ await upd(id,{status:"in_progress",startedAt:Date.now(),blockReason:null}); return; }
  if(a==="saveNotes"){ const n=S.notes[id]; if(n===undefined){flash(id+"n");return} if(await upd(id,{notes:n})){ delete S.notes[id]; flash(id+"n"); } return; }
  if(a==="saveWu"){ const w=S.writeups[id]; if(w===undefined){flash(id+"w");return} if(await upd(id,{writeup:w})){ delete S.writeups[id]; flash(id+"w"); } return; }
  if(a==="ai"){ writeUp(id); return; }
  if(a==="done"){ const patch={status:"done",finishedAt:Date.now(),blockReason:null}; if(S.notes[id]!==undefined) patch.notes=S.notes[id]; if(S.writeups[id]!==undefined) patch.writeup=S.writeups[id];
    if(await upd(id,patch)){ delete S.notes[id]; delete S.writeups[id]; S.view="jobs"; render(); window.scrollTo(0,0);} return; }
  if(a==="block"){ if(await upd(id,{status:"blocked",blockReason:v})){ S.view="jobs"; render(); window.scrollTo(0,0);} return; }
  if(a==="toFb"){ S.prevView=S.view; S.fbDraft.screen=({form:"tenantForm",sent:"tenantForm",mine:"tenantMine",jobs:"workerJobs",job:"workerJob",pin:"workerJobs"})[S.view]||"general"; S.fbErr=""; S.view="feedback"; render(); window.scrollTo(0,0); loadFb(); return; }
  if(a==="fbBack"){ S.view=S.prevView||(S.role==="worker"?"jobs":S.role==="office"?"office":"form"); render(); window.scrollTo(0,0); return; }
  if(a==="fbKind"){ S.fbDraft.kind=v; render(); return; }
  if(a==="fbSend"){ const d=S.fbDraft; if(!d.text.trim()){ S.fbErr=t("fbNeed"); render(); return; }
    S.fbErr=""; S.fbSending=true; render();
    try{ await api("POST","/api/feedback",{screen:d.screen||"general",kind:d.kind,text:d.text.trim()}); S.fbDraft.text=""; S.fbSent=true; setTimeout(()=>{S.fbSent=false; soft();},2500); loadFb(); }
    catch(e){ S.fbErr=e.message||t("saveErr"); }
    S.fbSending=false; render(); return; }
  if(a==="fbHandled"){ const f=S.fb.find(x=>x.id===id); if(!f) return; try{ await api("PATCH","/api/feedback/"+id,{handled:!f.handled}); f.handled=!f.handled; render(); }catch(e){} return; }
});
document.addEventListener("keydown",ev=>{ if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("blk")){ ev.preventDefault(); openEditor(ev.target.dataset.drag); return; }
  if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.pin){ const p=ev.target.value.trim(); if(p){ if(ev.target.dataset.pin==="office") tryOfficePin(p); else tryPin(p); } } });
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.f){ const d=draft(); d[el.dataset.f]=el.value; if(el.dataset.f==="priority") d.priTouched=true; return; }
  if(el.dataset.lk){ S.lookup[el.dataset.lk]=el.value; return; }
  if(el.dataset.chat){ S.chat[el.dataset.chat]=el.value; return; }
  if(el.dataset.fb){ S.fbDraft.text=el.value; return; }
  if(el.dataset.notes){ S.notes[el.dataset.notes]=el.value; return; }
  if(el.dataset.wu){ S.writeups[el.dataset.wu]=el.value; return; }
  if(el.dataset.ed&&S.ed){ S.ed[el.dataset.ed]=el.value; return; }
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.dataset.fbsel){ S.fbDraft.screen=el.value; return; }
  if(el.dataset.cal){ if(el.value){ S.calDate=el.value; render(); } return; }
  if(el.dataset.ed&&S.ed){ S.ed[el.dataset.ed]=el.value; return; }
  if(el.dataset.sched){ const id=el.dataset.id; const j=S.jobs.find(x=>x.id===id)||{};
    S.sched[id]=Object.assign({date:(j.visit&&j.visit.date)||today(),slot:(j.visit&&j.visit.slot)||j.timePref||"anytime"},S.sched[id]||{},{[el.dataset.sched]:el.value}); return; }
  if(el.dataset.act==="pickFiles"){ S.files=Array.from(el.files||[]).slice(0,6); render(); return; }
  if(el.dataset.act==="jobPhoto"){
    const id=el.dataset.id,k=el.dataset.k,files=Array.from(el.files||[]).slice(0,6); if(!files.length) return;
    S.busy[id+k]=1; render();
    const u=await uploadFiles(id,k,files);
    delete S.busy[id+k];
    if(u.last&&u.last.id) putJob(u.last);
    if(u.tooBig) S.err[id]=t("tooBig"); else if(u.failed) S.err[id]=t("uploadErr");
    render();
  }
});

/* ---------- start ---------- */
render();
(async()=>{
  try{ S.cfg=await api("GET","/api/config"); }catch(e){}
  if(S.pin){ const ok=await loadJobs(); if(ok){ S.authed=true; try{S.health=await api("GET","/api/health")}catch(e){} } else { S.pin=""; store.del("mzs-pin"); } }
  if(S.opin){ const ok=await loadOffice(); if(ok){ S.oauthed=true; if(!S.health) try{S.health=await api("GET","/api/health")}catch(e){} } else { S.opin=""; store.del("mzs-opin"); } }
  if(S.role==="worker") S.view=S.authed?"jobs":"pin";
  if(S.role==="office") S.view=S.oauthed?"office":"opin";
  render();
  setInterval(()=>{
    if(document.hidden) return;
    if(S.role==="worker"&&S.authed&&(S.view==="jobs"||S.view==="job")) loadJobs();
    else if(S.role==="office"&&S.oauthed&&(S.view==="office"||S.view==="officeReq")) loadOffice();
    else if(S.view==="mine"&&S.lookup.phone&&S.lookup.apt) loadMine();
    else if(S.view==="feedback"&&S.authed) loadFb();
  },60000);
})();

})();
</script>
