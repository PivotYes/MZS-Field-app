<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZS Field App (Test)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#14181F; --ink2:#4A515C; --line:#C9CED6; --soft:#E6E8EC;
  --blue:#1F5FBF; --blue2:#174A94; --blueSoft:#DCE7F7; --onBlue:#FFFFFF;
  --urg:#8A3A08; --urgSoft:#FBE3D2; --ok:#1E6B3A; --okSoft:#DDF0E3; --warnSoft:#FFF6F0; --warnLine:#E0A27A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1216; --card:#1A1F27; --ink:#EEF1F5; --ink2:#AEB6C2; --line:#3A424F; --soft:#262C36;
    --blue:#7FA8EC; --blue2:#9DBDF2; --blueSoft:#1E2C44; --onBlue:#0F1216;
    --urg:#F2A877; --urgSoft:#3A2416; --ok:#7FCB98; --okSoft:#17301F; --warnSoft:#2A1E16; --warnLine:#8A5A3A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1216; --card:#1A1F27; --ink:#EEF1F5; --ink2:#AEB6C2; --line:#3A424F; --soft:#262C36;
  --blue:#7FA8EC; --blue2:#9DBDF2; --blueSoft:#1E2C44; --onBlue:#0F1216;
  --urg:#F2A877; --urgSoft:#3A2416; --ok:#7FCB98; --okSoft:#17301F; --warnSoft:#2A1E16; --warnLine:#8A5A3A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--soft)}
.hbar{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
h1{font-size:28px;margin:20px 0 4px}
h2{font-size:20px;margin:24px 0 8px}
.sub{color:var(--ink2);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--soft);border-radius:16px;padding:16px;margin:12px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.tag.urg{background:var(--urgSoft);color:var(--urg)}
.tag.blue{background:var(--blueSoft);color:var(--blue2)}
.tag.ok{background:var(--okSoft);color:var(--ok)}
.ttl{font-weight:700;font-size:19px;margin:2px 0}
.meta{color:var(--ink2);font-size:15px;margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--onBlue)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--onBlue)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;padding:10px 0;cursor:pointer;min-height:44px}
label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chip{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:8px;cursor:pointer;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blueSoft);color:var(--blue2)}
.alert{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--warnSoft);border:1px solid var(--warnLine);font-size:15px}
.note{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--blueSoft);color:var(--ink);font-size:15px}
.err{color:var(--urg);font-weight:700;font-size:15px;margin-top:8px}
.steps{display:flex;gap:6px;margin-top:12px}
.step{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink2)}
.step .bar{height:6px;border-radius:3px;background:var(--soft);margin-bottom:4px}
.step.on{color:var(--ink)} .step.on .bar{background:var(--blue)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img,.photos video{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--soft);background:var(--soft)}
.file{display:block;width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:12px;font:inherit;color:var(--ink2);background:var(--card)}
.big{font-size:22px;font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:28px 12px}
.writeup{white-space:pre-wrap}
.back{display:inline-flex;align-items:center;gap:4px}
.small{font-size:13px;color:var(--ink2)}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--blueSoft);font-size:15px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.fbdone{opacity:.6}
</style>
<style type="text/css" nonce="">.redacted {
  color: red !important;
}</style></head>
<body>
<header><div class="hbar" id="hbar"></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>

<script>
(function(){
"use strict";

/* ---------- words ---------- */
const T = {
  en:{
    tenant:"Tenant", worker:"Worker", loading:"Loading…",
    reportTitle:"Report a problem", myReq:"See my requests",
    emergency:"Fire, gas smell, or flooding? Call 911, then [MZS emergency line].",
    building:"Building address", apt:"Apartment", phone:"Phone", yourName:"Your name",
    whatsWrong:"What’s wrong?", tellMore:"Tell us more", tellMoreHint:"Type, or tap the mic on your phone keyboard to speak.",
    photo:"Photo / video", bestTime:"Best time for us to come in",
    morning:"Morning", afternoon:"Afternoon", anytime:"Anytime",
    send:"Send to maintenance", sending:"Sending…",
    needApt:"Please add the apartment, phone, and what’s wrong.",
    sentTitle:"Request sent", sentBody:"Your ticket number is", sentNext:"You’ll see updates here when it’s scheduled and when it’s fixed.",
    newReq:"+ Report a new problem", myRequests:"My requests", open:"Open", past:"Past",
    noReq:"No requests yet.", ticket:"Ticket", sentOn:"Sent", fixedOn:"Fixed",
    received:"Received", scheduled:"Scheduled", fixed:"Fixed", visit:"Visit",
    reopen:"Not fixed? Reopen", reopened:"Reopened",
    hi:"Hi", jobsToday:"open jobs", doneCount:"done",
    openTab:"Open", doneTab:"Done", noJobs:"No open jobs. Send a test request from the Tenant tab.",
    noDone:"Nothing finished yet.",
    map:"Map", openJob:"Open job", flag:"+ Flag a new problem",
    urgent:"URGENT", inProgress:"IN PROGRESS", sched:"SCHEDULED", newT:"NEW", blocked:"ON HOLD", done:"DONE",
    back:"‹ My jobs", officeNote:"Tenant says", best:"Best time",
    call:"Call tenant", schedule:"Schedule visit", date:"Date", slot:"Time", saveSched:"Save visit",
    start:"Start job", started:"Started", before:"Before photo / video", after:"After photo / video",
    notes:"Your notes", notesHint:"Type, or use your phone’s mic. Any language is fine.",
    saveNotes:"Save notes", saved:"Saved",
    writeup:"Write-up for the office", makeWriteup:"Write it up for the office", writing:"Writing…",
    writeupHint:"Written from your notes, in English. You can edit it.", saveWriteup:"Save write-up",
    markDone:"Done", couldnt:"Couldn’t finish? Pick one",
    noAccess:"No access", needParts:"Need parts", needTrade:"Need another trade", notHome:"Tenant not home", anotherDay:"Need another day",
    markUrgent:"Mark urgent", unmarkUrgent:"Remove urgent", del:"Delete this job", confirmDel:"Delete this job for everyone?",
    finished:"Finished", reason:"Reason",
    readOnly:"You can look around, but you can’t save. Ask the owner to share this with you as a Contributor.",
    noDb:"This app needs you to be signed in to Claude to save and see jobs.",
    saveErr:"Couldn’t save. Check your connection and try again.",
    aiErr:"Couldn’t write it up right now. You can type it yourself.",
    uploadErr:"Some photos didn’t upload.",
    flaggedBy:"Flagged by worker",
    testing:"TEST VERSION.", testingSub:"Try it out and tell us what to change.", giveFb:"Give feedback", backToApp:"‹ Back to the app",
    fbTitle:"Feedback", fbSub:"What should we change before this goes live and connects to Airtable? Every note is saved here for the team.",
    fbWhere:"Which screen?", fbKind:"What kind?", fbText:"Your feedback", fbNeed:"Please write your feedback.", fbThanks:"Thanks, it’s saved ✓",
    fbSendBtn:"Send feedback", fbList:"All feedback", fbNone:"No feedback yet.", handled:"HANDLED", markHandled:"Mark handled", reopenFb:"Mark open",
    sc_general:"General / whole app", sc_tenantForm:"Tenant: Report a problem", sc_tenantMine:"Tenant: My requests", sc_workerJobs:"Worker: Job list", sc_workerJob:"Worker: A job", sc_airtable:"Airtable fields",
    k_bug:"Something’s broken", k_change:"Change this", k_idea:"New idea", k_missing:"Something’s missing",
    atTitle:"Fields that will go to Airtable", atSub:"Each request becomes one Airtable record with these fields. Anything to add, rename, or drop? Send it as feedback under “Airtable fields.”",
    cat:{heat:"No heat / hot water",leak:"Leak / water",electric:"Electric / lights",appliance:"Appliance",door:"Door / lock / window",pests:"Pests",building:"Building / hallway",other:"Something else"}
  },
  es:{
    tenant:"Inquilino", worker:"Técnico", loading:"Cargando…",
    reportTitle:"Reportar un problema", myReq:"Ver mis solicitudes",
    emergency:"¿Fuego, olor a gas o inundación? Llame al 911 y luego a [línea de emergencia MZS].",
    building:"Dirección del edificio", apt:"Apartamento", phone:"Teléfono", yourName:"Su nombre",
    whatsWrong:"¿Qué pasa?", tellMore:"Cuéntenos más", tellMoreHint:"Escriba, o toque el micrófono del teclado para hablar.",
    photo:"Foto / video", bestTime:"Mejor hora para entrar",
    morning:"Mañana", afternoon:"Tarde", anytime:"Cualquier hora",
    send:"Enviar a mantenimiento", sending:"Enviando…",
    needApt:"Agregue el apartamento, el teléfono y el problema.",
    sentTitle:"Solicitud enviada", sentBody:"Su número de ticket es", sentNext:"Verá aquí cuando esté programado y cuando esté arreglado.",
    newReq:"+ Reportar otro problema", myRequests:"Mis solicitudes", open:"Abiertas", past:"Anteriores",
    noReq:"Todavía no hay solicitudes.", ticket:"Ticket", sentOn:"Enviado", fixedOn:"Arreglado",
    received:"Recibido", scheduled:"Programado", fixed:"Arreglado", visit:"Visita",
    reopen:"¿No se arregló? Reabrir", reopened:"Reabierto",
    hi:"Hola", jobsToday:"trabajos abiertos", doneCount:"hechos",
    openTab:"Abiertos", doneTab:"Hechos", noJobs:"No hay trabajos abiertos. Envíe una prueba desde Inquilino.",
    noDone:"Nada terminado todavía.",
    map:"Mapa", openJob:"Abrir trabajo", flag:"+ Reportar un problema nuevo",
    urgent:"URGENTE", inProgress:"EN CURSO", sched:"PROGRAMADO", newT:"NUEVO", blocked:"EN PAUSA", done:"HECHO",
    back:"‹ Mis trabajos", officeNote:"El inquilino dice", best:"Mejor hora",
    call:"Llamar al inquilino", schedule:"Programar visita", date:"Fecha", slot:"Hora", saveSched:"Guardar visita",
    start:"Empezar trabajo", started:"Empezó", before:"Foto / video antes", after:"Foto / video después",
    notes:"Sus notas", notesHint:"Escriba o use el micrófono. Cualquier idioma.",
    saveNotes:"Guardar notas", saved:"Guardado",
    writeup:"Reporte para la oficina", makeWriteup:"Hacer reporte para la oficina", writing:"Escribiendo…",
    writeupHint:"Hecho de sus notas, en inglés. Puede editarlo.", saveWriteup:"Guardar reporte",
    markDone:"Hecho", couldnt:"¿No pudo terminar? Elija uno",
    noAccess:"Sin acceso", needParts:"Faltan piezas", needTrade:"Otro oficio", notHome:"Inquilino no está", anotherDay:"Otro día",
    markUrgent:"Marcar urgente", unmarkUrgent:"Quitar urgente", del:"Borrar este trabajo", confirmDel:"¿Borrar este trabajo para todos?",
    finished:"Terminado", reason:"Motivo",
    readOnly:"Puede mirar, pero no guardar. Pida al dueño acceso de Colaborador.",
    noDb:"Necesita iniciar sesión en Claude para guardar y ver trabajos.",
    saveErr:"No se pudo guardar. Revise la conexión e intente otra vez.",
    aiErr:"No se pudo escribir el reporte ahora. Puede escribirlo usted.",
    uploadErr:"Algunas fotos no se subieron.",
    flaggedBy:"Reportado por técnico",
    cat:{heat:"Sin calefacción / agua caliente",leak:"Fuga / agua",electric:"Electricidad / luces",appliance:"Electrodoméstico",door:"Puerta / cerradura / ventana",pests:"Plagas",building:"Edificio / pasillo",other:"Otra cosa"}
  }
};
const CATS=["heat","leak","electric","appliance","door","pests","building","other"];
const BLOCKS=["noAccess","needParts","needTrade","notHome","anotherDay"];

/* ---------- state ---------- */
const S={
  lang:"en", role:"tenant", view:"form", jobs:[], loaded:false, jobId:null,
  me:null, myName:"", db:null, assets:null, sample:null, readOnly:false, noDb:false,
  draft:{building:"",apt:"",phone:"",name:"",category:"",details:"",timePref:"anytime"},
  files:[], sending:false, formErr:"", lastTicket:"", fromWorker:false,
  workerTab:"open", notes:{}, writeups:{}, sched:{}, busy:{}, flash:{}, err:{},
  fb:[], fbDraft:{screen:"general",kind:"change",text:""}, fbSending:false, fbErr:"", fbSent:false, prevView:null
};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
S.lang = store.get("mzs-lang")==="es" ? "es" : "en";
S.role = store.get("mzs-role")==="worker" ? "worker" : "tenant";
S.view = S.role==="worker" ? "jobs" : "form";
let mine=[]; try{mine=JSON.parse(store.get("mzs-mine")||"[]")}catch(e){mine=[]}

const t=k=>T[S.lang][k]??T.en[k]??k;
const catName=c=>(T[S.lang].cat[c]||T.en.cat[c]||c);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime=ms=>ms?new Date(ms).toLocaleTimeString(S.lang==="es"?"es-US":"en-US",{hour:"numeric",minute:"2-digit"}):"";
const fmtDate=ms=>ms?new Date(ms).toLocaleDateString(S.lang==="es"?"es-US":"en-US",{month:"short",day:"numeric"}):"";
const fmtVisit=v=>{ if(!v||!v.date) return ""; const d=new Date(v.date+"T12:00:00"); return d.toLocaleDateString(S.lang==="es"?"es-US":"en-US",{weekday:"short",month:"short",day:"numeric"})+" · "+t(v.slot||"anytime"); };
const blob=id=>"/_blob/"+encodeURIComponent(id);

/* ---------- rendering ---------- */
let pending=false;
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"))}
function soft(){ if(isTyping()){pending=true;return} render(); }
document.addEventListener("focusout",()=>{ if(pending){pending=false;setTimeout(()=>{ if(!isTyping()) render(); else pending=true; },0)} });

function header(){
  document.getElementById("hbar").innerHTML=
    `<span class="brand">MZS</span>
     <div class="seg" role="group" aria-label="View as">
       <button data-act="role" data-v="tenant" aria-pressed="${S.role==="tenant"}">${t("tenant")}</button>
       <button data-act="role" data-v="worker" aria-pressed="${S.role==="worker"}">${t("worker")}</button>
     </div>
     <div class="seg" role="group" aria-label="Language">
       <button data-act="lang" data-v="en" aria-pressed="${S.lang==="en"}">EN</button>
       <button data-act="lang" data-v="es" aria-pressed="${S.lang==="es"}">ES</button>
     </div>`;
  document.documentElement.lang=S.lang;
}
function banners(){
  let h=S.view==="feedback"?"":`<div class="testbar"><span><b>${t("testing")}</b> ${t("testingSub")}</span><button class="btn sm primary" data-act="toFb">${t("giveFb")}</button></div>`;
  if(S.noDb) h+=`<div class="alert">${t("noDb")}</div>`;
  else if(S.readOnly) h+=`<div class="alert">${t("readOnly")}</div>`;
  return h;
}
function render(){
  header();
  const app=document.getElementById("app");
  let h=banners();
  if(S.view==="form") h+=vForm();
  else if(S.view==="sent") h+=vSent();
  else if(S.view==="mine") h+=vMine();
  else if(S.view==="jobs") h+=vJobs();
  else if(S.view==="job") h+=vJob();
  else if(S.view==="feedback") h+=vFeedback();
  app.innerHTML=h;
}

function chip(act,v,on,label){return `<button type="button" class="chip" data-act="${act}" data-v="${v}" aria-pressed="${on}">${esc(label)}</button>`}

function vForm(){
  const d=S.draft;
  return `
  ${S.fromWorker?`<button class="link back" data-act="toJobs">${t("back")}</button>`:""}
  <h1>${t("reportTitle")}</h1>
  ${S.fromWorker?"":`<button class="link" data-act="toMine">${t("myReq")} ›</button>`}
  <div class="alert">${t("emergency")}</div>
  <label for="f-building">${t("building")}</label>
  <input id="f-building" type="text" data-f="building" value="${esc(d.building)}" autocomplete="street-address">
  <label for="f-apt">${t("apt")}</label>
  <input id="f-apt" type="text" data-f="apt" value="${esc(d.apt)}">
  <label for="f-phone">${t("phone")}</label>
  <input id="f-phone" type="tel" data-f="phone" value="${esc(d.phone)}" autocomplete="tel">
  <label for="f-name">${t("yourName")}</label>
  <input id="f-name" type="text" data-f="name" value="${esc(d.name)}" autocomplete="name">
  <label id="l-cat">${t("whatsWrong")}</label>
  <div class="chips" role="group" aria-labelledby="l-cat">${CATS.map(c=>chip("cat",c,d.category===c,catName(c))).join("")}</div>
  <label for="f-details">${t("tellMore")}</label>
  <p class="small" style="margin:0 0 6px">${t("tellMoreHint")}</p>
  <textarea id="f-details" data-f="details">${esc(d.details)}</textarea>
  ${S.assets?`<label for="f-files">${t("photo")}</label>
  <input id="f-files" class="file" type="file" accept="image/*,video/*" multiple data-act="pickFiles">
  ${S.files.length?`<p class="small">${S.files.length} ✓</p>`:""}`:""}
  <label id="l-time">${t("bestTime")}</label>
  <div class="chips three" role="group" aria-labelledby="l-time">${["morning","afternoon","anytime"].map(x=>chip("time",x,d.timePref===x,t(x))).join("")}</div>
  ${S.formErr?`<p class="err" role="alert">${esc(S.formErr)}</p>`:""}
  <div style="margin-top:20px"><button class="btn primary block" data-act="send" ${S.sending||S.readOnly||S.noDb?"disabled":""}>${S.sending?t("sending"):t("send")}</button></div>`;
}
function vSent(){
  return `<div class="card" style="margin-top:24px">
    <p class="ttl">${t("sentTitle")} ✓</p>
    <p>${t("sentBody")} <span class="big">#${esc(S.lastTicket)}</span></p>
    <p class="meta">${t("sentNext")}</p>
    <div class="row"><button class="btn primary" data-act="toMine">${t("myRequests")}</button>
    <button class="btn" data-act="newForm">${t("newReq")}</button></div></div>`;
}
function stepsHtml(j){
  const lvl = j.status==="done"?3 : (j.status==="scheduled"||j.status==="in_progress"||(j.status==="blocked"&&j.visit))?2 : 1;
  return `<div class="steps">${["received","scheduled","fixed"].map((s,i)=>`<div class="step ${i<lvl?"on":""}"><div class="bar"></div>${t(s)}</div>`).join("")}</div>`;
}
function myJobs(){ return S.jobs.filter(j=>(S.me&&j.createdBy===S.me)||mine.includes(j.id)); }
function vMine(){
  const list=myJobs().filter(j=>!j.byWorker).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const open=list.filter(j=>j.status!=="done"), past=list.filter(j=>j.status==="done");
  const card=j=>`<div class="card">
    <div class="tags">${j.status==="done"?`<span class="tag ok">${t("fixed").toUpperCase()}</span>`:""}${j.reopened&&j.status!=="done"?`<span class="tag">${t("reopened").toUpperCase()}</span>`:""}</div>
    <p class="ttl">${esc(catName(j.category))}</p>
    <p class="meta">${t("ticket")} #${esc(j.ticket)} · ${j.status==="done"?t("fixedOn")+" "+fmtDate(j.finishedAt):t("sentOn")+" "+fmtDate(j.createdAt)}</p>
    ${j.status!=="done"?stepsHtml(j):""}
    ${j.visit&&j.status!=="done"?`<p class="meta" style="margin-top:10px"><b>${t("visit")}:</b> ${esc(fmtVisit(j.visit))}</p>`:""}
    ${j.status==="done"&&j.afterPhotos&&j.afterPhotos.length?`<div class="photos">${photoHtml(j.afterPhotos)}</div>`:""}
    ${j.status==="done"?`<div class="row"><button class="btn sm" data-act="reopen" data-id="${esc(j.id)}" ${S.readOnly?"disabled":""}>${t("reopen")}</button></div>`:""}
  </div>`;
  return `<button class="link back" data-act="newForm">‹ ${t("reportTitle")}</button>
  <h1>${t("myRequests")}</h1>

/* ---------- writes ---------- */
async function upd(id,patch,errKey){
  if(!S.db) return false;
  try{ await S.db.collection("requests").doc(id).update(Object.assign({updatedAt:Date.now()},patch)); delete S.err[id]; return true; }
  catch(e){ if(e&&e.code==="invalid_argument") S.readOnly=true; S.err[id]=t("saveErr"); render(); return false; }
}
async function uploadFiles(files){
  const out=[]; let failed=0;
  for(const f of files){
    try{ const r=await S.assets.upload(f); out.push({id:r.id,type:f.type||""}); }catch(e){ failed++; }
  }
  return {out,failed};
}
function flash(key){ S.flash[key]=1; render(); setTimeout(()=>{delete S.flash[key]; soft();},1800); }

async function send(){
  const d=S.draft;
  if(!d.apt.trim()||!d.phone.trim()||!d.category){ S.formErr=t("needApt"); render(); return; }
  S.formErr=""; S.sending=true; render();
  let photos=[], upFail=0;
  if(S.files.length&&S.assets){ const r=await uploadFiles(S.files); photos=r.out; upFail=r.failed; }
  const ticket=String(Date.now()).slice(-5);
  const now=Date.now();
  const body={ticket,building:d.building.trim(),apt:d.apt.trim(),phone:d.phone.trim(),name:d.name.trim(),category:d.category,details:d.details.trim(),
    timePref:d.timePref,photos,status:"received",urgent:(d.category==="heat"||d.category==="leak"),createdAt:now,updatedAt:now,
    createdBy:S.me||null,byWorker:!!S.fromWorker,lang:S.lang};
  try{
    const ref=S.db.collection("requests").doc();
    await ref.set(body);
    mine.push(ref.id); store.set("mzs-mine",JSON.stringify(mine.slice(-50)));
    S.lastTicket=ticket; S.files=[];
    const keep={building:d.building,apt:d.apt,phone:d.phone,name:d.name};
    S.draft=Object.assign({category:"",details:"",timePref:"anytime"},keep);
    S.sending=false;
    if(S.fromWorker){ S.fromWorker=false; S.view="jobs"; }
    else S.view="sent";
    if(upFail) S.formErr=t("uploadErr");
    render(); window.scrollTo(0,0);
  }catch(e){
    S.sending=false; if(e&&e.code==="invalid_argument") S.readOnly=true;
    S.formErr=t("saveErr"); render();
  }
}

async function writeUp(id){
  const j=S.jobs.find(x=>x.id===id); if(!j||!S.sample) return;
  const notes=(S.notes[id]??j.notes??"").trim();
  S.busy[id+"ai"]=1; render();
  const prompt=`You write short job reports for a property maintenance office. Write in plain English, even if the notes are in Spanish or another language (translate them).
Use exactly these four labeled lines, each one short:
Problem found:
What was fixed:
Parts used:
Follow-up needed:
If something isn't known from the notes, write "[not noted]". No extra text before or after.

Job type: ${catName(j.category)} (${T.en.cat[j.category]||j.category})
Tenant's description: ${j.details||"(none)"}
Worker's notes: ${notes||"(none)"}
Status: ${j.status}${j.blockReason?" ("+T.en[j.blockReason]+")":""}`;
  try{
    const r=await S.sample(prompt,{modelTier:"quick"});
    S.writeups[id]=(r.text||"").trim();
    delete S.busy[id+"ai"];
    if(notes!==(j.notes||"")) await upd(id,{notes});
    await upd(id,{writeup:S.writeups[id]});
    delete S.writeups[id];
  }catch(e){
    delete S.busy[id+"ai"]; S.err[id]=t("aiErr");
    if(e&&e.code==="not_granted"){ S.sample=null; }
  }
  render();
}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
  if(a==="pickFiles"||a==="jobPhoto") return;
  if(a==="toFb"){ S.prevView=S.view; S.fbDraft.screen=({form:"tenantForm",sent:"tenantForm",mine:"tenantMine",jobs:"workerJobs",job:"workerJob"})[S.view]||"general"; S.fbErr=""; S.view="feedback"; render(); window.scrollTo(0,0); return; }
  if(a==="fbBack"){ S.view=S.prevView||(S.role==="worker"?"jobs":"form"); render(); window.scrollTo(0,0); return; }
  if(a==="fbKind"){ S.fbDraft.kind=v; render(); return; }
  if(a==="fbSend"){ const d=S.fbDraft; if(!d.text.trim()){ S.fbErr=t("fbNeed"); render(); return; }
    S.fbErr=""; S.fbSending=true; render();
    try{ await S.db.collection("feedback").doc().set({screen:d.screen||"general",kind:d.kind,text:d.text.trim(),createdAt:Date.now(),createdBy:S.me||null,handled:false,lang:S.lang});
      S.fbDraft.text=""; S.fbSent=true; setTimeout(()=>{S.fbSent=false; soft();},2500);
    }catch(e){ if(e&&e.code==="invalid_argument") S.readOnly=true; S.fbErr=t("saveErr"); }
    S.fbSending=false; render(); return; }
  if(a==="fbHandled"){ const f=S.fb.find(x=>x.id===id); if(!f) return; try{ await S.db.collection("feedback").doc(id).update({handled:!f.handled}); }catch(e){} return; }
  if(a==="role"){ S.role=v; store.set("mzs-role",v); S.view=v==="worker"?"jobs":"form"; S.fromWorker=false; render(); window.scrollTo(0,0); return; }
  if(a==="lang"){ S.lang=v; store.set("mzs-lang",v); render(); return; }
  if(a==="cat"){ S.draft.category=v; render(); return; }
  if(a==="time"){ S.draft.timePref=v; render(); return; }
  if(a==="send"){ send(); return; }
  if(a==="toMine"){ S.view="mine"; render(); window.scrollTo(0,0); return; }
  if(a==="newForm"){ S.view="form"; S.formErr=""; render(); window.scrollTo(0,0); return; }
  if(a==="toJobs"){ S.view="jobs"; S.fromWorker=false; render(); window.scrollTo(0,0); return; }
  if(a==="wtab"){ S.workerTab=v; render(); return; }
  if(a==="openJob"){ S.jobId=id; S.view="job"; render(); window.scrollTo(0,0); return; }
  if(a==="flag"){ S.fromWorker=true; S.view="form"; S.formErr=""; render(); window.scrollTo(0,0); return; }
  if(a==="reopen"){ await upd(id,{status:"received",reopened:true,finishedAt:null,startedAt:null,visit:null}); return; }
  if(a==="urgent"){ const j=S.jobs.find(x=>x.id===id); if(j) await upd(id,{urgent:!j.urgent}); return; }
  if(a==="saveSched"){ const j=S.jobs.find(x=>x.id===id); const sc=S.sched[id]||{date:(j.visit&&j.visit.date)||new Date().toISOString().slice(0,10),slot:(j.visit&&j.visit.slot)||j.timePref||"anytime"};
    const patch={visit:{date:sc.date,slot:sc.slot}}; if(j.status==="received"||j.status==="blocked") patch.status="scheduled";
    if(await upd(id,patch)){ delete S.sched[id]; flash(id+"s"); } return; }
  if(a==="start"){ await upd(id,{status:"in_progress",startedAt:Date.now(),blockReason:null}); return; }
  if(a==="saveNotes"){ const n=S.notes[id]; if(n===undefined){flash(id+"n");return} if(await upd(id,{notes:n})){ delete S.notes[id]; flash(id+"n"); } return; }
  if(a==="saveWu"){ const w=S.writeups[id]; if(w===undefined){flash(id+"w");return} if(await upd(id,{writeup:w})){ delete S.writeups[id]; flash(id+"w"); } return; }
  if(a==="ai"){ writeUp(id); return; }
  if(a==="done"){ const patch={status:"done",finishedAt:Date.now(),blockReason:null}; if(S.notes[id]!==undefined) patch.notes=S.notes[id]; if(S.writeups[id]!==undefined) patch.writeup=S.writeups[id];
    if(await upd(id,patch)){ delete S.notes[id]; delete S.writeups[id]; S.view="jobs"; render(); window.scrollTo(0,0);} return; }
  if(a==="block"){ if(await upd(id,{status:"blocked",blockReason:v})){ S.view="jobs"; render(); window.scrollTo(0,0);} return; }
  if(a==="del"){ if(!confirm(t("confirmDel"))) return; try{ await S.db.collection("requests").doc(id).delete(); S.view="jobs"; render(); }catch(e){ S.err[id]=t("saveErr"); render(); } return; }
});

document.addEventListener("change",async ev=>{

  if(el.dataset.sched){ const id=el.dataset.id; const j=S.jobs.find(x=>x.id===id)||{};
    S.sched[id]=Object.assign({date:(j.visit&&j.visit.date)||new Date().toISOString().slice(0,10),slot:(j.visit&&j.visit.slot)||j.timePref||"anytime"},S.sched[id]||{},{[el.dataset.sched]:el.value}); return; }
  if(el.dataset.act==="pickFiles"){ S.files=Array.from(el.files||[]).slice(0,6); render(); return; }
  if(el.dataset.act==="jobPhoto"){
    const id=el.dataset.id,k=el.dataset.k,files=Array.from(el.files||[]).slice(0,6); if(!files.length) return;

    if(out.length&&j) await upd(id,{[k]:(j[k]||[]).concat(out)});
    if(failed) S.err[id]=t("uploadErr");
    render();
  }
});
